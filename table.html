<style>
        nav {
            width: 95%;
            margin: 20px auto;
            background: #dedede;
            box-shadow: 2px 2px 8px #aaa;
        }

        nav ul {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            flex: 1 1 auto;
            text-align: center;
            padding: 18px 12px;
            background: #dedede;
            transition: 0.3s;
        }

        nav ul li:hover {
            background: #050358;
        }

        nav ul li a {
            display: block;
            color: #111;
            text-decoration: none;
            font-size: 16px;
        }

        nav ul li:hover a {
            color: white;
        }
    body {
        margin: 0px;
        padding: 0px;
        transition: 0.59s;

    }

    header {

        background: black;
        color: white;
        font-size: 10px;
        font-family: Inter black;
        text-align: center;
        text-transform: uppercase;
        padding: 10px;
        box-shadow: 2px 2px 2px rgb(26, 25, 25);
    }

    footer {
        background:black;
        color:white;
        font-size:20px;
        text-align:center;
        
    }

    main table {
        width:90%;
        margin-top:10px;
        margin-bottom:50px;
        margin:auto;
        cursor:pointer;
        transition:2s;
        box-shadow:2px 2px 2px gray;
    }

    main table th {
        background: rgb(66, 156, 66);
        color: white;
    }

    main table td {
        text-align: center;
        transition: 2s;

    }

    main table td:hover {
        background: rgb(96, 240, 96);
        transform: scale(1.10);
    }

    tr {
        background: rgb(79, 196, 79)
    }

    main table tr:hover {
        background: rgb(201, 72, 72)
    }

    /* Large devices (laptops/desktops, 992px and up) */

    @media only screen and (min-width: 992px) {
        }

        header {
            font-size: 60px;

        }

        main table {
            width: 80%;

        }
        nav{
            width:40%;
            box-shadow:10px 10px 10px black;
            margin:auto;
            text-align:center;

        }
          nav ul li
        {
          list-style:none;
          padding:20px;
          background:rgb(155, 154, 151); 
          margin-left:-4px;
          cursor:pointer; 
          margin-left:-33px;
        }
        nav ul li:hover
        {
            color:white;
            background:black;
        }
        nav ul li a:link
        
        {
            color:black;
            text-decoration:none;
        }
        nav ul li a:visited
        {
            color:black;
        }
        nav ul li a:hover
        {
            color:white;

        }
        nav ul li:hover a:visited
        {
            color:white;
            text-decoration:underline;
        }

    }
</style>
