<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>

    <style>
        body {
            margin: 0;
            background: #101827;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 120px;
        }

        h1 {
            color: white;
            font-size: 35px;
        }

        #c1 {
            color: #facc15;
            font-size: 55px;
            font-family: Arial Black;
            background: #1e293b;
            display: inline-block;
            padding: 25px 45px;
            margin-top: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 25px #facc1555;
            border: 2px solid #facc15;
        }

        p {
            color: #94a3b8;
            font-size: 16px;
            margin-top: 30px;
        }

        button {
            background: #facc15;
            color: #101827;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background: white;
        }
    </style>

</head>

<body>

    <h1>Digital Clock</h1>
    <div id="c1">Time</div>
    <p>JavaScript Date Class</p>
    <button onclick="startclock()">Start clock</button>
    <button onclick="stopclock()">Stop clock</button>
    <script>


        function show() {
            var d = new Date()
            var c = document.getElementById("c1")
            c.innerHTML = d.toLocaleTimeString()
            c.style.display = "inline-block"
        }



        var d
        function startclock() {
            c = setInterval(show, 1000)
        }
        function stopclock() {
            clearInterval(c)
        }

    </script>

</body>

</html>
