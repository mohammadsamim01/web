
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
body
        {
            background-color: #111827;
            text-align: center;
            font-family: Arial;
            margin: 0;
            padding: 30px;
        }

        h1
        {
            color: white;
            font-size: 35px;
            margin-bottom: 30px;
        }

        .pic
        {
            width: 200px;
            height: 200px;
            object-fit: cover;
            margin: 15px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px black;
            transition: 0.5s;
            cursor: pointer;
        }

        .pic:hover
        {
            transform: scale(1.1);
            box-shadow: 0px 8px 20px #38bdf8;
        }
    </style>
</head>

<body>

    <script>

        for(var i = 1; i <= 10; i++)
        {
            document.write("<img src='image/p" + i + ".jpg' class='pic'>")
        }

        document.title = "Ready"

    </script>

</body>
</html>
