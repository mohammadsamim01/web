    <style>
        nav {
            width: 95%;
            margin: 20px auto;
            background: #dedede;
            box-shadow: 2px 2px 8px #aaa;
        }

        nav ul {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            flex: 1 1 auto;
            text-align: center;
            padding: 18px 12px;
            background: #dedede;
            transition: 0.3s;
        }

        nav ul li:hover {
            background: #050358;
        }

        nav ul li a {
            display: block;
            color: #111;
            text-decoration: none;
            font-size: 16px;
        }

        nav ul li:hover a {
            color: white;
        }
    </style>
