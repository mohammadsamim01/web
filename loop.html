
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
         body
        {
            background-color: #eaf0f6;
            text-align: center;
            font-family: Arial;
            padding: 20px;
        }

        h1
        {
            background-color: #172d54;
            color: white;
            padding: 12px;
            width: 300px;
            margin: 15px auto;
            border-radius: 10px;
            font-size: 22px;
        }
    </style>

    <script>
        /* Loop in JS: For Loop, While Loop, do while Loop */
        // Syntax :- grammar

        var n = prompt("Enter a Number to Create Table...?", "2")

        for(var i = 1; i <= 10; i++)
        {
            document.write("<h1>" + n + " * " + i + " = " + n*i + "</h1>")
        }

        document.write("Loop End")
        document.title = "Ready"
    </script>

</body>
</html>
