
<!DOCTYPE html>
<html lang="en">
<head>

    <title>Log in</title>

    <style>
        body {

            color: white;

            padding: 15px;
            font-size: 25px;
        }

        main table {
            margin: 50px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 2px 2px 10px gray;
        }

        caption 
        {
            font-size: 25px;
            font-weight: bold;
            padding: 15px;
            text-transform: uppercase;
        }

        input 
        
        {
            padding: 10px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        input
        {
            background: green;
            color: white;
            cursor: pointer;
        }

        input 
        {
            background: black;
            color: white;
            cursor: pointer;
        }

        {

        }

</head>

<link href="mainform.css" rel="stylesheet" type="text/css">

<header>
   Log in page html
</header>

<body>
    <main>
        <table border="0" cellpadding="20">
            <caption>login</caption>
            <form action="http://samim.com/user/get.php" method="post">
                <tr>
                    <td><label for="loginid">Login Id</label></td>
                    <td>
                        <input type="text" placeholder="Enter Login id" id="loginid" title="type id here" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="passid">password</label></td>
                    <td>
                        <input type="password" required placeholder="Enter password here" id="passid" title="type password..">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="login">
                        <input type="reset">
                    </td>
                </tr>
            </form>
        </table>
